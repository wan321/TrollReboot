name: Inject BatteryGuard into BatteryInfo

# 把 TrollReboot 的「充电卡死自动重启」能力注入「电池助手 1.0.7」：
# 只新增一个 BatteryGuard.dylib 并插一条 LC_LOAD_DYLIB，App 原有代码一个字节都不改。

on:
  workflow_dispatch:
  push:
    paths:
      - 'BatteryGuard/**'
      - 'TRBattery.m'
      - 'TRBattery.h'
      - 'TRMonitor.m'
      - 'TRMonitor.h'
      - 'TRRootOps.m'
      - 'TRRootOps.h'
      - 'vendor/**'
      - '.github/workflows/inject.yml'

permissions:
  contents: write

jobs:
  inject:
    name: Build injected TIPA
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid xz

      - name: Install Theos
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

      - name: Check inputs
        run: |
          set -euo pipefail
          test -f vendor/BatteryInfo_1.0.7.ipa
          test -f BatteryGuard/BGMain.m
          test -f TRBattery.m
          unzip -l vendor/BatteryInfo_1.0.7.ipa | head -20

      - name: Build BatteryGuard.dylib
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          xcodebuild -version
          mkdir -p dist
          clang -arch arm64 -miphoneos-version-min=14.0 -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -O2 -Wno-unused-but-set-variable \
            -framework UIKit -framework Foundation -framework IOKit \
            -Wl,-install_name,@executable_path/BatteryGuard.dylib \
            -I. -o dist/BatteryGuard.dylib \
            BatteryGuard/BGMain.m TRBattery.m TRMonitor.m TRRootOps.m 2>&1 | tee build-dylib.log
          ls -la dist/BatteryGuard.dylib
          file dist/BatteryGuard.dylib
          otool -L dist/BatteryGuard.dylib
          strings -a dist/BatteryGuard.dylib | grep -c "BatteryGuard 1.5"

      - name: Build bgreqd daemon
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -miphoneos-version-min=14.0 -isysroot "$SDK" \
            -fobjc-arc -O2 -Wno-unused-but-set-variable \
            -framework Foundation -framework IOKit \
            -I. -o dist/bgreqd \
            BatteryGuard/BGRequestServer.m TRBattery.m TRMonitor.m TRRootOps.m 2>&1 | tee build-daemon.log
          ls -la dist/bgreqd
          file dist/bgreqd
          otool -L dist/bgreqd
          strings -a dist/bgreqd | grep -c "BatteryGuard 1.5"

      - name: Build insert_dylib
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -target insert_dylib \
            -configuration Release SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20
          cp build/Release/insert_dylib /usr/local/bin/insert_dylib
          chmod +x /usr/local/bin/insert_dylib

      - name: Unpack IPA
        run: |
          set -euo pipefail
          rm -rf work && mkdir -p work
          unzip -q vendor/BatteryInfo_1.0.7.ipa -d work/ipa
          APP=$(find work/ipa/Payload -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          BIN_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "BIN_NAME=$BIN_NAME" >> "$GITHUB_ENV"
          ls -la "$APP"

      - name: Register URL scheme in Info.plist
        run: |
          set -euo pipefail
          APP="$APP"
          /usr/bin/python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          p = sys.argv[1]
          with open(p, 'rb') as f:
              d = plistlib.load(f)
          types = [t for t in d.get('CFBundleURLTypes', []) if t.get('CFBundleURLName') != 'com.wan.batterychargeguard']
          types.append({
              'CFBundleURLName': 'com.wan.batterychargeguard',
              'CFBundleURLSchemes': ['batterychargeguard'],
          })
          d['CFBundleURLTypes'] = types
          with open(p, 'wb') as f:
              plistlib.dump(d, f, fmt=plistlib.FMT_BINARY)
          print('CFBundleURLTypes =', d['CFBundleURLTypes'])
          PY
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$APP/Info.plist"

      - name: Inject dylib and resign
        run: |
          set -euo pipefail
          APP="$APP"
          BIN="$APP/$BIN_NAME"
          test -x "$BIN"

          echo "--- 原始二进制 ---"
          ls -la "$BIN"
          file "$BIN"

          # 原始 entitlements 备份（重签必须原样带回去，否则 App 的 IOKit 权限就没了）
          ldid -e "$BIN" > /tmp/orig-ent.plist
          cat /tmp/orig-ent.plist
          cp /tmp/orig-ent.plist work/orig-ent.plist

          # 放入 dylib 并签名
          cp dist/BatteryGuard.dylib "$APP/BatteryGuard.dylib"
          ldid -S "$APP/BatteryGuard.dylib"

          # 放入守护进程并签名（同样的 entitlements：要读 IOPMPowerSource、要起 root 子进程）
          cp dist/bgreqd "$APP/bgreqd"
          chmod 0755 "$APP/bgreqd"
          ldid -S/tmp/orig-ent.plist "$APP/bgreqd"

          # 插入 LC_LOAD_DYLIB（--strip-codesig：插入后原签名失效，随后 ldid 重签）
          insert_dylib --strip-codesig --overwrite \
            "@executable_path/BatteryGuard.dylib" "$BIN" "$BIN.tmp"
          mv "$BIN.tmp" "$BIN"
          chmod +x "$BIN"

          # 用原 entitlements 重签 App 主二进制
          ldid -S/tmp/orig-ent.plist "$BIN"

          echo "--- 注入后 ---"
          ls -la "$BIN"
          otool -L "$BIN"
          otool -l "$BIN" | grep -A2 LC_LOAD_DYLIB | grep -c BatteryGuard

      - name: Package TIPA
        run: |
          set -euo pipefail
          mkdir -p dist
          cd work/ipa
          zip -qry "$GITHUB_WORKSPACE/dist/BatteryGuard-1.0.7.tipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -la dist
          shasum -a 256 dist/BatteryGuard-1.0.7.tipa | tee dist/sha256.txt

      - name: Verify package
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          unzip -q dist/BatteryGuard-1.0.7.tipa -d verify
          APP=$(find verify/Payload -maxdepth 1 -name '*.app' | head -1)
          BIN="$APP/$BIN_NAME"
          test -f "$APP/BatteryGuard.dylib"
          test -x "$BIN"
          echo "--- dylib ---"
          file "$APP/BatteryGuard.dylib"
          echo "--- 加载项 ---"
          otool -L "$BIN" | grep BatteryGuard
          echo "--- 权限 ---"
          ldid -e "$BIN" | grep -E "platform-application|iokit-user-client-class|persona-mgmt" 
          echo "--- dylib 内字符串 ---"
          strings -a "$APP/BatteryGuard.dylib" | grep -E "BatteryGuard 1.5|trollstorehelper|com.wan.batterychargeguard|IOPMPowerSource|shareInfolist" | sort -u
          echo "--- URL scheme / HTTP 入口 ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Info.plist")" = "batterychargeguard"
          strings -a "$APP/BatteryGuard.dylib" | grep -q "batterychargeguard"
          strings -a "$APP/BatteryGuard.dylib" | grep -q "/batteryjson"
          echo "URL scheme + /batteryjson 端点已就位"
          echo "--- 守护进程 ---"
          test -x "$APP/bgreqd"
          file "$APP/bgreqd"
          ldid -e "$APP/bgreqd" | grep -E "platform-application|iokit-user-client-class|persona-mgmt"
          strings -a "$APP/bgreqd" | grep -E "BatteryGuard 1.5|com.wan.batterychargeguard|listen.conf" | sort -u
          strings -a "$APP/bgreqd" | grep -q "BatteryGuard 1.5"
          echo "守护进程已随包发布"
          echo "--- App 自身未被改动（应仍是原体积 ± 插入命令的几百字节）---"
          stat -f%z "$BIN"

      - name: Publish to repo dist
        run: |
          set +e
          cp dist/BatteryGuard-1.0.7.tipa "BatteryGuard-电池助手1.0.7.tipa"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "BatteryGuard-电池助手1.0.7.tipa"
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish BatteryGuard tipa [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase -q origin "$GITHUB_REF_NAME" || true
              if git push; then echo "pushed on attempt $i"; break; fi
              sleep $((i * 5))
            done
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BatteryGuard-tipa
          path: |
            dist/BatteryGuard-1.0.7.tipa
            dist/sha256.txt
            work/orig-ent.plist

      - name: Expose failure log in repo
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          cp -f build-dylib.log ci-logs/ 2>/dev/null || true
          date -u > ci-logs/when.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-logs
          if ! git diff --cached --quiet; then
            git commit -m "ci: error log [skip ci]"
            git push || true
          fi
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inject-logs
          path: |
            build-dylib.log
          if-no-files-found: ignore
