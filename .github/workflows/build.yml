name: Build TrollReboot TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build TrollReboot TIPA
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid xz

      - name: Install Theos
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

      - name: Check project
        run: |
          set -euo pipefail
          test -f Makefile
          test -f control
          test -f entitlements.plist
          test -f Resources/Info.plist
          plutil -lint Resources/Info.plist
          plutil -lint entitlements.plist
          echo "--- files ---"
          find . -maxdepth 2 -type f -not -path './.git/*' | sort

      - name: Build package
        run: |
          set -euo pipefail
          make clean || true
          set -o pipefail
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa 2>&1 | tee build.log
          ls -la packages || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE=$(find packages -maxdepth 1 \( -name '*.tipa' -o -name '*.ipa' \) -print | head -n 1 || true)
          if [ -z "${PACKAGE:-}" ]; then
            echo "ERROR: no package produced"
            ls -la packages || true
            exit 1
          fi
          echo "Package: $PACKAGE"

          unzip -t "$PACKAGE"
          TMP=$(mktemp -d)
          unzip -q "$PACKAGE" -d "$TMP"

          APP=$(find "$TMP/Payload" -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP"
          echo "App: $APP"
          ls -la "$APP"

          BIN="$APP/TrollReboot"
          test -f "$BIN"
          file -b "$BIN"
          lipo -info "$BIN"

          # 主二进制必须是真正的 Mach-O 可执行（不是 .dSYM 的 DWARF）
          otool -hv "$BIN" | tee /tmp/otool.txt
          if grep -Eq 'DSYM|OBJECT' /tmp/otool.txt; then
            echo "ERROR: main binary is not an executable Mach-O"
            exit 1
          fi

          BININFO=$(file -b "$BIN")
          case "$BININFO" in
            *"Mach-O"*"executable"*) echo "OK: main binary is Mach-O executable" ;;
            *) echo "ERROR: unexpected binary type: $BININFO"; exit 1 ;;
          esac

          echo "========== ENTITLEMENTS =========="
          ldid -e "$BIN" | tee /tmp/ent.plist
          grep -q 'platform-application' /tmp/ent.plist || { echo "ERROR: missing platform-application"; exit 1; }
          grep -q 'persona-mgmt' /tmp/ent.plist || { echo "ERROR: missing persona-mgmt"; exit 1; }

          echo "========== URL SCHEMES =========="
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes" "$APP/Info.plist"

          echo "========== RUNTIME FLAGS =========="
          strings -a "$BIN" > /tmp/strings.txt
          grep -q -- '--daemon' /tmp/strings.txt || { echo "ERROR: --daemon flag missing"; exit 1; }
          grep -q -- '--install-daemon' /tmp/strings.txt || { echo "ERROR: --install-daemon flag missing"; exit 1; }
          grep -q -- '--install-daemon-hard' /tmp/strings.txt || { echo "ERROR: --install-daemon-hard flag missing"; exit 1; }
          grep -q -- '--uninstall-daemon' /tmp/strings.txt || { echo "ERROR: --uninstall-daemon flag missing"; exit 1; }
          grep -q -- '--install-launcher' /tmp/strings.txt || { echo "ERROR: --install-launcher flag missing"; exit 1; }
          grep -q -- '--uninstall-launcher' /tmp/strings.txt || { echo "ERROR: --uninstall-launcher flag missing"; exit 1; }
          grep -q '.TrollRebootLauncher' /tmp/strings.txt || { echo "ERROR: launcher marker missing"; exit 1; }
          grep -q 'com.apple.Bridge' /tmp/strings.txt || { echo "ERROR: com.apple.Bridge (Watch) target missing"; exit 1; }
          grep -q 'com.apple.tips' /tmp/strings.txt || echo "WARN: com.apple.tips literal not found"
                    grep -q 'launcher.target' /tmp/strings.txt || { echo "ERROR: launcher.target missing"; exit 1; }
          grep -q -- '/install-launcher' /tmp/strings.txt || { echo "ERROR: /install-launcher endpoint missing"; exit 1; }
          grep -q 'install enter uid=' /tmp/strings.txt || { echo "ERROR: install identity log missing"; exit 1; }
          grep -q -- '/install-hard' /tmp/strings.txt || { echo "ERROR: /install-hard endpoint missing"; exit 1; }
          grep -q -- '/System/Library/LaunchDaemons' /tmp/strings.txt || { echo "ERROR: /System plist path missing"; exit 1; }
          grep -q '8899' /tmp/strings.txt || echo "WARN: port 8899 literal not found (可能是分段字符串)"
          grep -q 'launchctl' /tmp/strings.txt || echo "WARN: launchctl literal not found"
          grep -q 'AppleSmartBattery' /tmp/strings.txt || { echo "ERROR: AppleSmartBattery service name missing"; exit 1; }
          grep -q 'InstantAmperage' /tmp/strings.txt || { echo "ERROR: InstantAmperage key missing"; exit 1; }
          grep -q 'charge-probe.log' /tmp/strings.txt || { echo "ERROR: charge-probe.log path missing"; exit 1; }
          grep -q 'IOKit.framework' /tmp/strings.txt || { echo "ERROR: IOKit dlopen path missing"; exit 1; }
          grep -q '/battery' /tmp/strings.txt || { echo "ERROR: /battery endpoint missing"; exit 1; }
          grep -q 'AppleARMPMUCharger' /tmp/strings.txt || { echo "ERROR: AppleARMPMUCharger service missing"; exit 1; }
          grep -q 'IOMasterPort' /tmp/strings.txt || { echo "ERROR: IOMasterPort symbol missing"; exit 1; }
          grep -q -- '--daemon-restart' /tmp/strings.txt || { echo "ERROR: --daemon-restart arg missing"; exit 1; }
          grep -q -- '/batteryjson' /tmp/strings.txt || { echo "ERROR: /batteryjson endpoint missing"; exit 1; }
          grep -q 'TrollReboot 3.5-mon2' /tmp/strings.txt || { echo "ERROR: build tag missing"; exit 1; }
          grep -q 'hw.machine' /tmp/strings.txt || { echo "ERROR: hw.machine sysctl missing"; exit 1; }
          grep -q 'kern.boottime' /tmp/strings.txt || { echo "ERROR: kern.boottime sysctl missing"; exit 1; }
          grep -q -- '/monitor/set' /tmp/strings.txt || { echo "ERROR: /monitor/set endpoint missing"; exit 1; }
          grep -q -- '/monitor/reset' /tmp/strings.txt || { echo "ERROR: /monitor/reset endpoint missing"; exit 1; }
          grep -q 'stuckMinutes' /tmp/strings.txt || { echo "ERROR: stuckMinutes key missing"; exit 1; }
          grep -q 'monitor.conf' /tmp/strings.txt || { echo "ERROR: monitor.conf path missing"; exit 1; }
          grep -q 'monitor.state' /tmp/strings.txt || { echo "ERROR: monitor.state path missing"; exit 1; }
          grep -q 'TrollReboot 3.5-mon2' /tmp/strings.txt || { echo "ERROR: build tag 3.5-mon missing"; exit 1; }
          echo "OK: 守护进程入口字符串齐全"

          mkdir -p dist
          cp "$PACKAGE" dist/TrollReboot.tipa
          ls -la dist

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollReboot-tipa
          path: dist/TrollReboot.tipa
          if-no-files-found: error
